name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: pages
          commit_message: "deploy to pages: ${{ github.sha }}"

      - name: Verify published schemas
        run: |
          set -euo pipefail
          verify() {
            local name="$1"
            local url="https://xcharts-team.github.io/schema/${name}.json"
            local expected="static/schema/${name}.json"
            for attempt in $(seq 1 20); do
              if curl -fsS --max-time 20 "$url" -o "/tmp/${name}.live.json"; then
                if diff -q "$expected" "/tmp/${name}.live.json"; then
                  echo "published ${name} schema matches $expected (attempt $attempt)"
                  return 0
                fi
                echo "attempt $attempt: published ${name} schema differs from $expected"
              else
                echo "attempt $attempt: $url not reachable yet"
              fi
              sleep 15
            done
            echo "published ${name} schema check failed" >&2
            return 1
          }
          verify chart-2.0
          verify theme-2.0
