name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Deploy to pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: pages
          commit_message: "deploy to pages: ${{ github.sha }}"

      - name: Verify published chart schema
        run: |
          set -euo pipefail
          url="https://xcharts-team.github.io/schema/chart-2.0.json"
          expected="static/schema/chart-2.0.json"
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 20 "$url" -o /tmp/chart-2.0.live.json; then
              if diff -q "$expected" /tmp/chart-2.0.live.json; then
                echo "published schema matches $expected (attempt $attempt)"
                exit 0
              fi
              echo "attempt $attempt: published schema differs from $expected"
            else
              echo "attempt $attempt: $url not reachable yet"
            fi
            sleep 15
          done
          echo "published chart schema check failed" >&2
          exit 1
